<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Apollo NFC-1 Installer</title>
    <meta
      name="description"
      content="Easily allow users to install Apollo NFC-1 firmware on the web."
    />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="dark light" />
    <style>
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI",
          Roboto, Ubuntu, sans-serif;
        padding: 0;
        margin: 0;
        line-height: 1.4;
      }
      .content {
        max-width: 600px;
        margin: 0 auto;
        padding: 12px;
      }
      h2 {
        margin-top: 2em;
      }
      h3 {
        margin-top: 1.5em;
      }
      a {
        color: #03a9f4;
      }
      .invisible {
        visibility: hidden;
      }
      .hidden {
        display: none;
      }
      esp-web-install-button[install-unsupported] {
        visibility: inherit;
      }
      .content pre {
        max-width: 100%;
        overflow-y: scroll;
      }
      .footer {
        margin-top: 24px;
        border-top: 1px solid #ccc;
        padding-top: 24px;
        text-align: center;
      }
      .footer .initiative {
        font-style: italic;
        margin-top: 16px;
      }
      table {
        border-spacing: 0;
      }
      td {
        padding: 8px;
        border-bottom: 1px solid #ccc;
      }
      .radios li {
        list-style: none;
        line-height: 2em;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #333;
          color: #fff;
        }
        a {
          color: #58a6ff;
        }
      }
    </style>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  </head>
  <body>

    <div class="content">
      <h1>Apollo NFC-1 Installer</h1>

      <p>The Apollo NFC-1 is an NFC tag reader and writer for Home Assistant, built on ESPHome with an ESP32-C6 and NXP PN7160. Plug it in over USB and click the button below to install the latest firmware.</p>

      <div class="button-row" style="display: flex; justify-content: center; gap: 20px; align-items: center;">
        <div>
          <p>NFC-1 Firmware</p>
          <esp-web-install-button manifest="./firmware/manifest.json"></esp-web-install-button>
        </div>
      </div>

      <div class="footer">
        <a href="https://github.com/ApolloAutomation/NFC-1"
          >Apollo NFC-1</a
        > &mdash;
        Installer powered by <a href="https://esphome.github.io/esp-web-tools/">ESP Web Tools</a>.
      </div>
    </div>
  </body>
</html>
